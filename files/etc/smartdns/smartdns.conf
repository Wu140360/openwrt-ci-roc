# ============================================================
#  SmartDNS 配置 —— 兆能 M2 家庭主路由
#  策略：国内上游为默认组；开发 / 易污染域名走 foreign（加密 DNS）
#  作用：在不使用代理的情况下，尽量降低 DNS 污染（含 github.com 等）
#  说明：SmartDNS 监听 53，dnsmasq 仅做 DHCP（见 uci-defaults 脚本）
# ============================================================

# ---------- 监听 ----------
bind [::]:53
bind-tcp [::]:53
bind 127.0.0.1:53
bind-tcp 127.0.0.1:53

# ---------- 缓存（减少重复查询、提升抗污染稳定性）----------
cache-size 32768
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400

# ---------- 并发查询 / 测速 ----------
speed-check-mode ping,tcp:443
dualstack-ip-selection yes
force-aaaa-soa no

# ---------- 日志 ----------
log-level warn
log-file /tmp/smartdns.log
log-size 128KB

# ============================================================
#  默认组：国内公共 DNS（运营商 / 公共，延迟低）
# ============================================================
server 223.5.5.5
server 119.29.29.29
server 223.6.6.6

# ============================================================
#  Foreign 组：可信加密上游（Cloudflare / Google DoT + DoH）
#  用于易被污染的域名（GitHub 等开发资源）
# ============================================================
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group foreign
server-tls 1.0.0.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group foreign
server-tls 8.8.8.8:853 -host-name dns.google -tls-host-verify dns.google -group foreign
server-https https://1.1.1.1/dns-query -group foreign
server-https https://8.8.8.8/dns-query -group foreign

# ============================================================
#  域名分流规则：走 foreign（加密 / 可信）组
# ============================================================

# --- GitHub 全系 ---
domain-rules github.com -group foreign
domain-rules www.github.com -group foreign
domain-rules api.github.com -group foreign
domain-rules raw.githubusercontent.com -group foreign
domain-rules gist.githubusercontent.com -group foreign
domain-rules camo.githubusercontent.com -group foreign
domain-rules user-images.githubusercontent.com -group foreign
domain-rules objects.githubusercontent.com -group foreign
domain-rules avatars.githubusercontent.com -group foreign
domain-rules assets.githubusercontent.com -group foreign
domain-rules githubassets.com -group foreign
domain-rules github.io -group foreign

# --- 国内直连的 GitHub 加速 / 镜像域名也走 foreign（避免污染）---
domain-rules ghproxy.cn -group foreign
domain-rules gh-proxy.com -group foreign

# --- CDN / 包管理器（jsDelivr、Fastly、npm、PyPI、Go、Rust）---
domain-rules jsdelivr.net -group foreign
domain-rules cdn.jsdelivr.net -group foreign
domain-rules fastly.net -group foreign
domain-rules npmjs.com -group foreign
domain-rules registry.npmjs.org -group foreign
domain-rules pypi.org -group foreign
domain-rules files.pythonhosted.org -group foreign
domain-rules pythonhosted.org -group foreign
domain-rules go.dev -group foreign
domain-rules golang.org -group foreign
domain-rules proxy.golang.org -group foreign
domain-rules pkg.go.dev -group foreign
domain-rules rust-lang.org -group foreign
domain-rules crates.io -group foreign
domain-rules static.crates.io -group foreign
domain-rules index.crates.io -group foreign

# --- 通用开发 / 代码托管 ---
domain-rules gitlab.com -group foreign
domain-rules bitbucket.org -group foreign
domain-rules cloudflare.com -group foreign
domain-rules cloudflare-dns.com -group foreign
domain-rules docker.com -group foreign
domain-rules docker.io -group foreign
domain-rules registry-1.docker.io -group foreign

# ============================================================
#  本地服务：不走 foreign，直接解析到路由器
# ============================================================
domain-rules openwrt.lan -address 192.168.2.1
domain-rules *.openwrt.lan -address 192.168.2.1
domain-rules localhost -address 127.0.0.1

# ============================================================
#  备注：
#  - 若运营商拦截 853/443 的加密 DNS，可将 foreign 组上游替换为
#    阿里 DoT 223.5.5.5:853 或腾讯 119.29.29.29:853 实测
#  - 切勿将所有域名都丢进 foreign，会增加延迟与失败率
#  - 首编后用 `nslookup github.com 127.0.0.1` 与
#    `dig +short raw.githubusercontent.com` 验证
# ============================================================
