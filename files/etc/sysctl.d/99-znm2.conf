# 兆能 M2（IPQ6000 / 512M RAM）内核网络参数
# 由 /etc/init.d/sysctl 在启动时加载（/etc/sysctl.d/*.conf）

# 连接跟踪表：512M 内存下留出余量
net.netfilter.nf_conntrack_max = 131072

# BBR 拥塞控制（依赖 kmod-tcp-bbr）
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_codel

# 高吞吐/低延迟队列与缓冲
net.core.netdev_max_backlog = 4096
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304

# 文件句柄上限
fs.file-max = 65535

# 注意：不开启 packet steering / irqbalance / flow offloading，
#       以免与 NSS 的硬件加速路径冲突。
