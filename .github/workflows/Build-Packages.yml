name: Build-Packages
on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'OpenWrt SDK 版本'
        required: false
        default: '25.12'
        type: choice
        options:
          - '25.12'
          - 'main'
          - '24.10'
      package:
        description: '要编译的软件包 (当前仅用于独立包编译)'
        required: false
        default: 'luci-theme-aurora'
        type: choice
        options:
          - 'luci-theme-aurora'
          - 'luci-app-qosify'
          - 'luci-app-smartdns'
          - 'nginx'

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Shanghai
  OUTPUT_DIR: ${{ github.workspace }}/artifacts/packages

jobs:
  Prepare:
    name: Prepare Matrix(准备编译矩阵)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate Build Matrix(生成编译矩阵)
        id: matrix
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          SELECTED_SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          selected_package = os.environ["SELECTED_PACKAGE"].lower()
          selected_sdk_version = os.environ["SELECTED_SDK_VERSION"]
          sdk_versions = ["25.12", "main", "24.10"]
          if selected_sdk_version == "ALL":
              selected_sdk_versions = sdk_versions
          elif selected_sdk_version in sdk_versions:
              selected_sdk_versions = [selected_sdk_version]
          else:
              raise SystemExit(f"Unsupported sdk_version: {selected_sdk_version}")

          include = [
              {
                  "sdk_version": sdk_version,
                  "name": "ipq60xx",
                  "openwrt_target": "qualcommax",
                  "openwrt_subtarget": "ipq60xx",
                  "openwrt_target_profile": "",
                  "config_files": "configs/znm2.config configs/General.config",
              }
              for sdk_version in selected_sdk_versions
          ]
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  Build:
    name: Build (${{ matrix.sdk_version }} / ${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: Prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Prepare.outputs.matrix) }}
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "CPU: $(grep "model name" /proc/cpuinfo | head -1 | cut -d: -f2)"
          echo "Cores: $(nproc)"
          free -h
          df -hT

      - name: Initialization Environment(初始化环境)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install \
            build-essential clang curl file flex bison g++ gawk gcc-multilib \
            gettext gnupg git libelf-dev libfuse-dev libncurses-dev libssl-dev \
            python3 python3-setuptools rsync tar unzip wget xz-utils zip zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Checkout(检出代码)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve And Verify SDK Metadata(解析并验证SDK元数据)
        id: sdk
        env:
          OPENWRT_TARGET: ${{ matrix.openwrt_target }}
          OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
          OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
          SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
          SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
          SDK_METADATA_ONLY: '1'
        run: |
          chmod +x scripts/SDK-script.sh
          scripts/SDK-script.sh

      - name: Build Packages With OpenWrt SDK(使用OpenWrt SDK编译软件包)
        env:
          OPENWRT_TARGET: ${{ matrix.openwrt_target }}
          OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
          OPENWRT_TARGET_PROFILE: ${{ matrix.openwrt_target_profile }}
          PACKAGE_CONFIG_FILES: ${{ matrix.config_files }}
          PACKAGE_ARCH_NAME: ${{ matrix.name }}
          PACKAGE_SELECTED_ARCH: ${{ matrix.name }}
          PACKAGE_SELECTION: ${{ inputs.package }}
          OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
          SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
          SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
          SDK_ROOT: ${{ runner.temp }}/openwrt-sdk
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
          SDK_URL: ${{ steps.sdk.outputs.url }}
        run: |
          chmod +x scripts/SDK-script.sh
          scripts/SDK-script.sh

      - name: Upload Packages Artifact(上传软件包产物)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sdk_version }}-Packages-${{ matrix.name }}
          path: artifacts/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  Release:
    runs-on: ubuntu-24.04
    needs: Build
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Packages Artifacts(下载软件包产物)
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Packages-*'
          path: artifacts/release
          merge-multiple: true

      - name: Check Downloaded Packages(检查已下载的软件包)
        id: packages
        run: |
          mkdir -p artifacts/release
          if find artifacts/release -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.ipk' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有可发布的成功编译产物"
          fi

      - name: Upload Packages To Release(发布软件包)
        if: ${{ steps.packages.outputs.found == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          name: Packages-ZNM2
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          tag: Packages-ZNM2
          token: ${{ github.token }}
          artifacts: artifacts/release/*
          body: |
            **兆能M2 软件包 - qualcommax/ipq60xx**

            SDK版本: ${{ inputs.sdk_version }}
            编译架构: qualcommax/ipq60xx
            编译包: ${{ inputs.package }}

            安装方式:
            - apk: `apk add --allow-untrusted *.apk`
            - ipk: `opkg install *.ipk`
