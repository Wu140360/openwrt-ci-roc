name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ60XX.config
      firmware_tag: ZN-M2
      kernel_file: kernel-6.12
      artifact_prefix: ZN-M2
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        兆能 M2 (ZN-M2 / IPQ6000) 专用固件：仅编译 zn_m2 一个机型，LibWrt 25.12-nss / 6.12 内核 / apk。
        适配硬改 512MB 内存、USB3.0 与 uboot 96m 大分区；无 WiFi 下 q6_region 缩减为 16MB。
        满血有线 NSS（ECM + 全部有线客户端），完全剔除 WiFi 驱动/固件/hostapd/wpad 与 NSS WiFi 卸载。
        完整 USB3.0 存储（UASP、ext4/vfat/exfat/ntfs3、block-mount、hd-idle）；Aurora 主题 + 全简体中文 LuCI。
        插件：SmartDNS、OpenClash（官方 master 最新）、UPnP、WireGuard、KMS(vlmcsd)、lucky 万吉版（构建时动态取官方最新 Release）、ttyd。
        集成 tmux/htop/btop/fdisk/tcpdump-mini/iperf3/mtr/nano 等配置调试工具，以及 diskman/nlbwmon/package-manager 等日常维护页面。
        与 lucky 万吉版重复的 DDNS/ACME/WoL/Samba/FRP 及 PassWall/SQM 等计划外组件均已排除。
