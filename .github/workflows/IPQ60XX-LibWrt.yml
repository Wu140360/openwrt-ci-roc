name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX
      kernel_file: kernel-6.12
      artifact_prefix: IPQ60XX
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      rename_qualcommax_to_nowifi: true
      release_summary: >-
        兆能 ZN M2 专用固件（分支 5）：仅编译 zn_m2 机型，完全无 WiFi；满血 NSS，
        q6_region 预留 16MB，NSS 固件沿用仓库默认推荐值；完整 USB3.0 支持；
        Aurora 主题 + 简体中文 LuCI；ttyd 终端与常用配置/调试工具；
        smartdns、OpenClash（官方 master 最新版）、UPnP、WireGuard、AdGuardHome、
        vlmcsd(KMS)、Lucky 万吉版（自动跟随 gdy666/lucky 最新 Release，不写死版本号）。
        与 Lucky 万吉内置模块重复的独立插件已移除，PassWall 等计划外插件已关闭。
        具体详见 configs/IPQ60XX.config、configs/General.config 与 scripts/Roc-script.sh。
