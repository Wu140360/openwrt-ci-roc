name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - zn-m2-nowifi-nss
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/ZN-M2.config
      firmware_tag: ZN-M2
      kernel_file: kernel-6.12
      artifact_prefix: ZN-M2
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      rename_qualcommax_to_nowifi: true
      release_summary: >-
        兆能 ZN-M2 专用无 WiFi 固件（512M 内存 / USB3.0 硬改 / 96M 大分区 uboot）：基于 LibWrt 25.12-nss 的 6.12 内核，
        满血 NSS 有线卸载（q6_region 预留 16MB、NSS 固件 11.4），彻底剔除 ath11k/WiFi 与 NSS WiFi-Mesh 模块；
        仅保留 zn_m2 一个机型；Aurora 主题 + 全简体中文；集成 SmartDNS、OpenClash(官方 master)、UPnP、
        集客 AC、WireGuard、KMS、Lucky 小满(动态最新版)、ttyd、完整 USB 挂载与日常维护工具。
        详见 configs/ZN-M2.config、configs/General.config 与 scripts/Roc-script.sh。
