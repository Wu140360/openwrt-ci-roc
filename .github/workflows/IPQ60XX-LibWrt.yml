name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX
      kernel_file: kernel-6.12
      artifact_prefix: IPQ60XX
      # 单机型（非 MULTI_PROFILE）时 PROFILE=DEVICE_zn_m2，LibWrt 的 manifest 名为
      # $(IMG_PREFIX)-$(PROFILE_SANITIZED).manifest，即带 -zn_m2 后缀
      manifest_file: libwrt-qualcommax-ipq60xx-zn_m2.manifest
      release_summary: >-
        这是兆能M2（ZN-M2 / IPQ6000）专用的6.12内核固件：完全不带WiFi，满血NSS数据面（drv/dp/ecm/crypto/cfi/mcs/clients），
        启用NSS硬件QoS（qdisc+igs）与nss-ifb；默认主题Aurora；集成lucky万吉版、EasyTier、SmartDNS、nlbwmon、ttyd、UPnP、
        KMS、WireGuard及完整USB/存储工具，具体详见IPQ60XX.config和General.config。
