name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      zn_m2_libwrt:
        description: 运行 IPQ60XX-LibWrt（兆能 ZN-M2 无 WiFi 满血 NSS）
        required: false
        type: boolean
        default: true
      verify_release:
        description: 仅核对已发布产物（不跑编译）
        required: false
        type: boolean
        default: false
      verify_tag:
        description: 要核对的 Release tag
        required: false
        type: string
        default: ZN-M2
  # schedule:
  #   - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:
    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.zn_m2_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write

    Verify-Release:
      if: ${{ inputs.verify_release }}
      runs-on: ubuntu-24.04
      permissions:
        contents: write
        actions: read
      steps:
        - uses: actions/checkout@v4
          with:
            persist-credentials: true
        - name: Download release assets
          env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ inputs.verify_tag }}
          run: |
            set -Eeuo pipefail
            mkdir -p /tmp/assets verify-out
            gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/assets \
              --pattern 'ZN-M2.manifest' \
              --pattern 'ZN-M2.config' \
              --pattern 'ZN-M2.config.buildinfo' \
              --pattern 'ZN-M2.third-party-sources.txt' \
              --pattern '*sysupgrade.bin' \
              --pattern '*factory.ubi' \
              --pattern 'ZN-M2.Packages.tar.gz'
            ls -l /tmp/assets
            cp /tmp/assets/ZN-M2.manifest /tmp/assets/ZN-M2.config \
               /tmp/assets/ZN-M2.config.buildinfo /tmp/assets/ZN-M2.third-party-sources.txt verify-out/
        - name: Inspect firmware and configs
          run: |
            set +e
            sudo apt-get update -qq
            sudo apt-get install -y -qq squashfs-tools device-tree-compiler u-boot-tools
            cd /tmp/assets
            sha256sum * > "$OLDPWD/verify-out/sha256sums.txt"
            SYS=$(ls *sysupgrade.bin | head -n1)
            UBI=$(ls *factory.ubi | head -n1)
            OUT="$OLDPWD/verify-out/firmware-check.txt"
            {
              echo "SYSUPGRADE=$SYS  SIZE=$(stat -c%s "$SYS")"
              echo "FACTORY_UBI=$UBI  SIZE=$(stat -c%s "$UBI")"
              echo "FILE=$(file "$SYS")"
              echo
              echo '=== q6_region byte pattern in sysupgrade ==='
              python3 -c "import sys; b=open(sys.argv[1],'rb').read(); p16=bytes.fromhex('000000004ab000000000000001000000'); p55=bytes.fromhex('000000004ab000000000000003700000'); print('16MB(0x01000000) occurrences:',b.count(p16)); print('55MB(0x03700000) occurrences:',b.count(p55))" "$SYS"
              echo
              echo '=== FIT / dtb ==='
              dumpimage -l "$SYS" 2>&1 | head -60
              echo
              echo '=== squashfs extraction ==='
              python3 -c "import sys; b=open(sys.argv[1],'rb').read(); i=b.find(b'hsqs'); print('hsqs offset:',i); open('/tmp/rootfs.squashfs','wb').write(b[i:]) if i>=0 else None" "$SYS"
              if [ -f /tmp/rootfs.squashfs ]; then
                unsquashfs -s /tmp/rootfs.squashfs 2>&1 | head -20
                unsquashfs -l /tmp/rootfs.squashfs 2>/dev/null > /tmp/sq.list
                echo "unsquashfs listed files: $(wc -l < /tmp/sq.list)"
                echo
                echo '--- WiFi-related files in rootfs (expect NONE) ---'
                grep -iE 'ath11k|wpad|mac80211|cfg80211|wireless-regdb|ipq-wifi|/etc/config/wireless|wifi-mesh' /tmp/sq.list | head -40
                echo "(count: $(grep -ciE 'ath11k|wpad|mac80211|cfg80211|wireless-regdb|ipq-wifi|/etc/config/wireless|wifi-mesh' /tmp/sq.list))"
                echo
                echo '--- required apps/files in rootfs ---'
                grep -iE 'lucky|aurora|smartdns|openclash|gecoosac|vlmcsd|ttyd|diskman|hd-idle|cpufreq|autoreboot|watchcat|miniupnpd|wireguard|block-mount|usb-storage|ntfs3|nls_utf8|zh-cn.lmo' /tmp/sq.list | head -90
                echo
                echo "--- zh-cn.lmo count: $(grep -c 'zh-cn.lmo' /tmp/sq.list) ---"
                echo
                echo '--- default IP in config_generate / uci-defaults ---'
                unsquashfs -d /tmp/sqroot -f /tmp/rootfs.squashfs >/dev/null 2>&1
                grep -rl '192.168.3.1' /tmp/sqroot/etc /tmp/sqroot/lib /tmp/sqroot/usr/lib 2>/dev/null | head -20
                echo 'IP literals found in config_generate / uci-defaults:'
                grep -rhoE '192\.168\.[0-9]+\.[0-9]+' /tmp/sqroot/etc/config_generate /tmp/sqroot/etc/uci-defaults 2>/dev/null | sort | uniq -c | head -20
                echo '--- lucky binary strings (variant hints) ---'
                if [ -f /tmp/sqroot/usr/bin/lucky ]; then
                  ls -l /tmp/sqroot/usr/bin/lucky
                  strings /tmp/sqroot/usr/bin/lucky 2>/dev/null | grep -iE 'xiaoman|小满|wanji|万吉|FileBrowser|CorazaWAF|lucky_|3\.8\.1' | head -25
                fi
                echo '=== extra checks ==='
                echo '--- sysupgrade tar members ---'
                tar -tvf "$SYS" 2>&1 | head -20
                echo '--- factory.ubi q6_region pattern ---'
                python3 -c "import sys; b=open(sys.argv[1],'rb').read(); p16=bytes.fromhex('000000004ab000000000000001000000'); p55=bytes.fromhex('000000004ab000000000000003700000'); print('16MB:',b.count(p16)); print('55MB:',b.count(p55))" "$UBI"
                echo '--- /bin/config_generate IP literals ---'
                ls -l /tmp/sqroot/bin/config_generate 2>&1
                grep -oE '192\.168\.[0-9]+\.[0-9]+' /tmp/sqroot/bin/config_generate 2>/dev/null | sort | uniq -c
                echo '--- aurora default theme in uci-defaults ---'
                grep -rl 'aurora' /tmp/sqroot/etc/uci-defaults 2>/dev/null | head -10
                echo '--- /etc/config/wireless present? ---'
                test -e /tmp/sqroot/etc/config/wireless && echo YES || echo NO
                echo '--- ath11k caldata hotplug script content ---'
                cat /tmp/sqroot/etc/hotplug.d/firmware/11-ath11k-caldata 2>/dev/null | head -30
                echo '--- Packages.tar.gz wifi-related apk ---'
                PKG=$(ls ZN-M2.Packages.tar.gz 2>/dev/null | head -n1)
                if [ -n "$PKG" ]; then
                  tar -tzf "$PKG" 2>/dev/null | grep -iE 'ath11k|wpad|ipq-wifi|wifi-mesh|autocore' | head -30
                  echo "(total entries: $(tar -tzf "$PKG" 2>/dev/null | wc -l))"
                fi
              fi
            } > "$OUT" 2>&1
            echo "--- firmware-check.txt preview ---"
            head -c 2500 "$OUT"
        - name: Extract config highlights
          run: |
            cd verify-out
            grep -E '^CONFIG_TARGET|^CONFIG_NSS_FIRMWARE|^CONFIG_PACKAGE_(nss-firmware|kmod-qca-nss|kmod-nss-ifb|sqm-scripts-nss|luci-theme|luci-app-aurora|luci-compat|luci-app-ttyd|ttyd|tmux|htop|btop|nano-full|ethtool|tcpdump-mini|firewall4|dnsmasq-full|luci-app-firewall|luci-proto-(ppp|ipv6|wireguard)|ppp-mod-pppoe|smartdns|luci-app-smartdns|luci-app-openclash|luci-app-upnp|miniupnpd|luci-app-gecoosac|gecoosac|wireguard-tools|kmod-wireguard|luci-app-vlmcsd|vlmcsd|luci-app-lucky|lucky|ruby|rust|luci-app-diskman|luci-app-hd-idle|luci-app-cpufreq|luci-app-autoreboot|luci-app-watchcat|luci-app-(ddns|acme|wol|frpc|frps|samba4|uhttpd|passwall|3cat|openlist2|aria2|sqm|banip)|kmod-(ath11k|mac80211|cfg80211|usb3|usb-dwc3|usb-storage|fs-|nls-)|wpad-openssl|ipq-wifi-zn_m2|wireless-regdb|block-mount|automount|e2fsprogs|f2fs-tools|losetup)|^CONFIG_LUCI_LANG|^CONFIG_RUBY_ENABLE_YJIT|^# CONFIG_RUBY_ENABLE_YJIT' ZN-M2.config > config-key.txt || true
            echo "key lines: $(wc -l < config-key.txt)"
            head -30 config-key.txt
        - name: Push verification bundle to temporary branch
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            set -Eeuo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B verify-ZN-M2
            git add verify-out
            git commit -m "chore: temporary ZN-M2 release verification bundle"
            git push -f origin verify-ZN-M2
            echo "PUSHED verify-ZN-M2"
