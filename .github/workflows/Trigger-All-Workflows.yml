name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      zn_m2_libwrt:
        description: 运行 IPQ60XX-LibWrt（兆能 ZN-M2 无 WiFi 满血 NSS）
        required: false
        type: boolean
        default: true
      diagnose_logs:
        description: 仅收集失败编译日志（不跑编译）
        required: false
        type: boolean
        default: false
      job_id:
        description: 失败 job id
        required: false
        type: string
        default: '138648624919'
  # schedule:
  #   - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:
    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.zn_m2_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write

    Collect-Logs:
      if: ${{ inputs.diagnose_logs }}
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        actions: read
      steps:
        - name: Download and extract failure log
          env:
            GH_TOKEN: ${{ github.token }}
            JOB_ID: ${{ inputs.job_id }}
          run: |
            set +e
            mkdir -p /tmp/joblogs
            code=$(curl -sSL --max-time 240 --compressed \
              -o /tmp/job-logs.bin -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs")
            echo "::notice title=DIAG::HTTP_CODE=$code SIZE=$(stat -c%s /tmp/job-logs.bin 2>/dev/null)"
            if [ "$code" != "200" ]; then
              echo "::notice title=DIAG::download failed: $(head -c 500 /tmp/job-logs.bin | tr '\n' ' ')"
              exit 0
            fi
            unzip -o -q /tmp/job-logs.bin -d /tmp/joblogs
            urc=$?
            echo "::notice title=DIAG::UNZIP_RC=$urc"
            if [ "$urc" -ne 0 ] && [ "$urc" -ne 1 ]; then
              if gzip -t /tmp/job-logs.bin 2>/dev/null; then
                gzip -dc /tmp/job-logs.bin > /tmp/joblogs/job.txt
              else
                cp /tmp/job-logs.bin /tmp/joblogs/job.txt
              fi
            fi
            find /tmp/joblogs -type f | sort > /tmp/logfiles
            echo "::notice title=DIAG::FILES=$(tr '\n' ' ' < /tmp/logfiles)"
            {
              echo '=== KEY ERRORS (last 250) ==='
              while IFS= read -r f; do
                grep -nEi 'make\[[0-9]+\]: \*\*\*|error:|\bERROR\b|\bfailed\b|curl: \(22\)|Hash mismatch|No rule to make target|is missing dependencies|unsatisfied|Cannot find|not found|fatal:|collect2:|undefined reference|Permission denied|No such file|missing' "$f" || true
              done < /tmp/logfiles | tail -n 250
              echo '=== COMPILE STEP TAIL ==='
              compile_file="$(grep -i 'Compile Firmware' /tmp/logfiles | head -n 1 || true)"
              if [ -n "$compile_file" ]; then
                echo "source: $compile_file"
                tail -n 180 "$compile_file"
              else
                while IFS= read -r f; do
                  awk '/Compile Firmware/{flag=1} flag{print}' "$f"
                done < /tmp/logfiles | tail -n 250
              fi
              echo '=== LAST 25 LINES PER FILE ==='
              while IFS= read -r f; do
                echo "--- $f"
                tail -n 25 "$f"
              done < /tmp/logfiles
            } > /tmp/keylog.txt
            echo "::notice title=DIAG::KEYLOG_BYTES=$(stat -c%s /tmp/keylog.txt)"
            split -b 3000 -d -a 3 /tmp/keylog.txt /tmp/chunk_
            i=0
            for f in /tmp/chunk_*; do
              i=$((i+1))
              msg=$(tr '\n' ' ' < "$f" | tr -d '\r' | sed 's/%/%25/g')
              echo "::notice title=LOG_$i::$msg"
            done
