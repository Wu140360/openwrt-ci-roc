name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      zn_m2_libwrt:
        description: 运行 IPQ60XX-LibWrt（兆能 ZN-M2 无 WiFi 满血 NSS）
        required: false
        type: boolean
        default: true
      diagnose_logs:
        description: 仅收集失败编译日志（不跑编译）
        required: false
        type: boolean
        default: false
      job_id:
        description: 失败 job id
        required: false
        type: string
        default: '138648624919'
  # schedule:
  #   - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:
    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.zn_m2_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write

    Collect-Logs:
      if: ${{ inputs.diagnose_logs }}
      runs-on: ubuntu-24.04
      permissions:
        contents: write
        actions: read
      steps:
        - name: Download and extract failure log
          env:
            GH_TOKEN: ${{ github.token }}
            JOB_ID: ${{ inputs.job_id }}
          run: |
            set +e
            mkdir -p /tmp/joblogs
            SUM="$GITHUB_STEP_SUMMARY"
            code=$(curl -sSL --max-time 240 --compressed \
              -o /tmp/job-logs.bin -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs")
            {
              echo '## Diagnose'
              echo ""
              echo "HTTP_CODE=$code"
              echo ""
              echo '```'
              file /tmp/job-logs.bin 2>&1
              ls -l /tmp/job-logs.bin 2>&1
              head -c 400 /tmp/job-logs.bin 2>/dev/null
              echo ""
              echo '```'
            } >> "$SUM"
            # 同时落盘并回传为 annotation / 仓库文件
            mkdir -p debug
            cp "$SUM" debug/build-failure.log
            tail -c 14000 debug/build-failure.log | tr '\n' ' ' | tr -d '\r' > /tmp/notice.txt
            echo "::notice title=BUILD_FAILURE::$(cat /tmp/notice.txt)" || true
            if [ "$code" != "200" ]; then
              echo "Download failed; see body above." >> "$SUM"
              exit 0
            fi
            unzip -o -q /tmp/job-logs.bin -d /tmp/joblogs
            urc=$?
            echo "UNZIP_RC=$urc" >> "$SUM"
            if [ "$urc" -ne 0 ] && [ "$urc" -ne 1 ]; then
              # maybe gzip or plain text
              if gzip -t /tmp/job-logs.bin 2>/dev/null; then
                gzip -dc /tmp/job-logs.bin > /tmp/job-logs.txt
                mv /tmp/job-logs.txt /tmp/joblogs/job.txt
              else
                cp /tmp/job-logs.bin /tmp/joblogs/job.txt
              fi
            fi
            find /tmp/joblogs -type f | sort > /tmp/logfiles
            {
              echo ""
              echo '## Log files'
              echo '```'
              find /tmp/joblogs -type f -printf '%p %s\n' | sort
              echo '```'
              echo ""
              echo '## Error lines (max 600)'
              echo '```'
              while IFS= read -r f; do
                grep -nEi 'error:|\bERROR\b|\bfailed\b|make\[[0-9]+\]: \*\*\*|No rule to make target|is missing dependencies|unsatisfied|Cannot find|not found|fatal:|collect2:|undefined reference|Permission denied|No such file|missing' "$f" || true
              done < /tmp/logfiles | head -n 600
              echo '```'
              echo ""
              echo '## Compile step tail'
              echo '```'
              compile_file="$(grep -i 'Compile Firmware' /tmp/logfiles | head -n 1 || true)"
              if [ -n "$compile_file" ]; then
                echo "source: $compile_file"
                tail -n 400 "$compile_file"
              else
                while IFS= read -r f; do
                  awk '/Compile Firmware/{flag=1} flag{print}' "$f"
                done < /tmp/logfiles | tail -n 500
              fi
              echo '```'
              echo ""
              echo '## Last 30 lines per file'
              echo '```'
              while IFS= read -r f; do
                echo "--- $f"
                tail -n 30 "$f"
              done < /tmp/logfiles
              echo '```'
            } >> "$SUM"
        - name: Push diagnostic file
          if: always()
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            set +e
            if [ ! -f debug/build-failure.log ]; then echo "no file"; exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug/build-failure.log
            git commit -m "chore: capture failed build log for diagnosis" || { echo "no changes"; exit 0; }
            git push origin "HEAD:${{ github.ref_name }}"
            echo "PUSH_RC=$?"
