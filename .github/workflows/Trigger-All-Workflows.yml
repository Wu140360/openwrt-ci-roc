name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      zn_m2_libwrt:
        description: 运行 IPQ60XX-LibWrt（兆能 ZN-M2 无 WiFi 满血 NSS）
        required: false
        type: boolean
        default: true
      diagnose_logs:
        description: 仅收集失败编译日志（不跑编译）
        required: false
        type: boolean
        default: false
      job_id:
        description: 失败 job id
        required: false
        type: string
        default: '138648624919'
  # schedule:
  #   - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:
    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.zn_m2_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write

    Collect-Logs:
      if: ${{ inputs.diagnose_logs }}
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        actions: read
      steps:
        - name: Download and extract failure log
          env:
            GH_TOKEN: ${{ github.token }}
            JOB_ID: ${{ inputs.job_id }}
          run: |
            set +e
            mkdir -p /tmp/joblogs
            code=$(curl -sSL --max-time 240 --compressed \
              -o /tmp/job-logs.bin -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs")
            echo "::notice title=DIAG::HTTP=$code SIZE=$(stat -c%s /tmp/job-logs.bin 2>/dev/null)"
            if [ "$code" != "200" ]; then exit 0; fi
            unzip -o -q /tmp/job-logs.bin -d /tmp/joblogs
            if [ "$?" -ne 0 ] && [ "$?" -ne 1 ]; then cp /tmp/job-logs.bin /tmp/joblogs/job.txt; fi
            find /tmp/joblogs -type f | sort > /tmp/logfiles
            LOG=$(head -n 1 /tmp/logfiles)
            {
              echo '=== COMPILE STEP: LAST 120 LINES ==='
              awk '/Compile Firmware/{f=1} /Check Space Usage/{f=0} f' "$LOG" | tail -n 120 | cut -c1-260
              echo '=== FILTERED ERROR LINES (last 60) ==='
              grep -nEi 'make\[[0-9]+\]: \*\*\*|make: \*\*\*|error: |ERROR:|curl: \(22\)|Hash mismatch|No rule to make target|is missing dependencies|unsatisfied|fatal:|collect2:|undefined reference|Download failed|Permission denied|not found' "$LOG" \
                | grep -vEi 'ccache |gcc |clang |SHELL= flock| -c -o |\.c$' | tail -n 60 | cut -c1-260
            } > /tmp/brief.txt
            head -c 35000 /tmp/brief.txt > /tmp/brief_t.txt
            rm -f /tmp/chunk_*
            split -b 3900 -d -a 2 /tmp/brief_t.txt /tmp/chunk_
            i=0
            for f in /tmp/chunk_*; do
              i=$((i+1))
              [ "$i" -gt 9 ] && break
              msg=$(tr '\n' ' ' < "$f" | tr -d '\r' | sed 's/%/%25/g')
              echo "::notice title=LOG_$i::$msg"
            done
