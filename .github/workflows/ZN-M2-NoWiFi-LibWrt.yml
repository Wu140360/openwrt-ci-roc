name: ZN-M2-NoWiFi-LibWrt

on:
  workflow_dispatch:
    inputs:
      lucky_version:
        description: 'Lucky 小满版本号；auto = 自动取官方文件服务最新版'
        required: false
        default: auto
        type: string
  workflow_call:
    inputs:
      lucky_version:
        required: false
        default: auto
        type: string
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/LibWrt.git
      repo_branch: 25.12-nss
      config_file: configs/ZN-M2.NoWiFi.config
      firmware_tag: ZN-M2-NoWiFi
      kernel_file: kernel-6.12
      artifact_prefix: ZN-M2-NoWiFi
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      lucky_version: ${{ inputs.lucky_version }}
      release_summary: >-
        兆能 ZN-M2 专用固件（硬改 512M 内存 / USB3.0 / 96M 大分区 U-Boot）：仅编译 zn_m2 一个机型，
        完全移除 WiFi，保留 LibWrt 满血 NSS（剔除 WiFi offload），q6_region 预留 16MB，
        完整 USB 3.0 主机与存储/文件系统，Aurora 主题与简体中文 LuCI，
        集成 ttyd、smartdns、OpenClash（官方 master 最新版）、UPnP、集客 AC、WireGuard、KMS(vlmcsd)、
        Lucky 小满版（官方文件服务动态最新版）以及磁盘/网络/调频等日常维护与调试工具。
        与 Lucky 小满模块重复的独立插件、PassWall、其他机型支持均已剔除。
