# ZN M2 / 512MB RAM tuning. Applied by /etc/init.d/sysctl during boot.
# qos-switch re-asserts the conntrack values after netfilter and ECM load.

# 64K tracked flows fit comfortably in 512MB and are enough for a busy NAT.
# qca-nss-ecm ships 32768; this file intentionally raises the ceiling.
net.netfilter.nf_conntrack_max = 65536

# Keep established TCP entries for one hour instead of the multi-day default.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600

# Short idle UDP timeout; active UDP streams keep a 2 minute timeout.
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Listen queue for local daemons; handles DHCP/DNS/HTTP bursts.
net.core.somaxconn = 4096

# SYN backlog for the same LAN bursts.
net.ipv4.tcp_max_syn_backlog = 4096

# 16MiB max socket buffers for 1Gbps LAN/WAN and WireGuard throughput.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Client and server TCP Fast Open for local services and proxies.
net.ipv4.tcp_fastopen = 3

# Enough file descriptors for routing, conntrack and the web/proxy daemons.
fs.file-max = 65535

# zram is the only swap device. A moderate bias lets compressed swap absorb
# cold pages without aggressively reclaiming active routing data.
vm.swappiness = 60

# Keep dentry/inode caches a little longer on a small-memory router.
vm.vfs_cache_pressure = 50
