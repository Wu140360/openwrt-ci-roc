# ZN M2 / 512MB RAM tuning. Comments explain why each value is set.
# Applied by /etc/init.d/sysctl during boot. qos-switch re-asserts the
# conntrack values after the netfilter modules and ECM are loaded.

# Netfilter: a 512MB router with NSS can comfortably track 64K flows.
# qca-nss-ecm ships 32768; this file intentionally raises the ceiling.
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Accept backlog for busy LAN bursts (DHCP/DNS/HTTP).
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Larger socket buffers for 1Gbps LAN/WAN and WireGuard throughput.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Client and server TFO, useful for local services and proxies.
net.ipv4.tcp_fastopen = 3

# Router workloads open many sockets and conntrack entries.
fs.file-max = 65535

# zram is the only swap device; a moderate bias avoids premature reclaim
# while still letting compressed swap absorb cold pages.
vm.swappiness = 60

# Keep dentry/inode caches a little longer on a small-memory router.
vm.vfs_cache_pressure = 50
